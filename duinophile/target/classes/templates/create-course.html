<div th:fragment="main">
    <div class="glass-card" style="max-width: 700px; margin: 2rem auto;">
        <h2>Create New Course</h2>
        <form th:action="@{/courses/create}" th:object="${course}" method="post">
            <div class="form-group">
                <label>Course Title</label>
                <input type="text" th:field="*{title}" placeholder="e.g., Intro to Arduino" required>
                <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color:var(--red); font-size:0.75rem; font-weight:700; display:block; margin-top:0.3rem; line-height:1.2;"></span>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea th:field="*{description}" placeholder="What will scholars learn?" rows="5" required></textarea>
                <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color:var(--red); font-size:0.75rem; font-weight:700; display:block; margin-top:0.3rem; line-height:1.2;"></span>
            </div>

            <div class="form-group">
                <label>Minimum Points Required to Enroll</label>
                <input type="number" th:field="*{minimumPointsRequired}" min="0" value="0" required>
                <span th:if="${#fields.hasErrors('minimumPointsRequired')}" th:errors="*{minimumPointsRequired}" style="color:var(--red); font-size:0.75rem; font-weight:700; display:block; margin-top:0.3rem;"></span>
            </div>

            <!-- 3-Stage Level Selector -->
            <div class="form-group">
                <label style="margin-bottom:0.75rem; display:block;">Course Level</label>
                <div style="display:grid; grid-template-columns: repeat(3,1fr); gap:0.75rem;">

                    <label class="level-card" style="cursor:pointer;">
                        <input type="radio" th:field="*{level}" value="BEGINNER" style="display:none;" required>
                        <div class="level-option" data-val="BEGINNER"
                             style="border:2px solid var(--border); border-radius:12px; padding:1.2rem 0.8rem;
                                    text-align:center; transition:all 0.2s ease; background:var(--surface);">
                            <div style="font-size:2rem; margin-bottom:0.4rem;">🌱</div>
                            <div style="font-weight:700; color:var(--green); font-size:0.9rem;">Beginner</div>
                            <div style="font-size:0.75rem; color:var(--text-muted); margin-top:0.3rem;">No prior knowledge needed</div>
                        </div>
                    </label>

                    <label class="level-card" style="cursor:pointer;">
                        <input type="radio" th:field="*{level}" value="INTERMEDIATE" style="display:none;">
                        <div class="level-option" data-val="INTERMEDIATE"
                             style="border:2px solid var(--border); border-radius:12px; padding:1.2rem 0.8rem;
                                    text-align:center; transition:all 0.2s ease; background:var(--surface);">
                            <div style="font-size:2rem; margin-bottom:0.4rem;">⚡</div>
                            <div style="font-weight:700; color:var(--blue); font-size:0.9rem;">Intermediate</div>
                            <div style="font-size:0.75rem; color:var(--text-muted); margin-top:0.3rem;">Some experience required</div>
                        </div>
                    </label>

                    <label class="level-card" style="cursor:pointer;">
                        <input type="radio" th:field="*{level}" value="ADVANCED" style="display:none;">
                        <div class="level-option" data-val="ADVANCED"
                             style="border:2px solid var(--border); border-radius:12px; padding:1.2rem 0.8rem;
                                    text-align:center; transition:all 0.2s ease; background:var(--surface);">
                            <div style="font-size:2rem; margin-bottom:0.4rem;">🔥</div>
                            <div style="font-weight:700; color:var(--red, #e03131); font-size:0.9rem;">Advanced</div>
                            <div style="font-size:0.75rem; color:var(--text-muted); margin-top:0.3rem;">Expert-level content</div>
                        </div>
                    </label>

                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top:1.5rem;">
                <button type="submit" class="btn">Create Course</button>
                <a th:href="@{/courses/list}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

    <style>
        .level-card input[type="radio"]:checked + .level-option {
            border-color: var(--navy) !important;
            background: var(--navy) !important;
            color: white;
            box-shadow: 0 4px 16px rgba(26,26,46,0.2);
            transform: translateY(-3px);
        }
        .level-card input[type="radio"]:checked + .level-option div:first-child {
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.6));
        }
    </style>
</div>
