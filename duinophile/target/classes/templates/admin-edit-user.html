<div th:fragment="main">
    <div style="max-width: 560px; margin: 2rem auto;">
        <div class="form-card">
            <!-- Header -->
            <div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:1.75rem;">
                <a th:href="@{/admin/dashboard}" class="btn btn-sm btn-secondary">← Back</a>
                <div>
                    <h2 style="margin:0; color:var(--navy);">Edit User</h2>
                    <p style="margin:0; font-size:0.82rem; color:var(--text-muted);">
                        Editing: <strong th:text="${editUser.username}">username</strong>
                    </p>
                </div>
            </div>

            <form th:action="@{/admin/edit-user/{id}(id=${editUser.id})}" th:object="${editUser}" method="post">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" th:field="*{fullName}" placeholder="Full name">
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" th:field="*{username}" readonly>
                        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color:var(--red); font-size: 0.8rem; display:block; margin-top:0.3rem;"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email <span style="color:var(--red);">*</span></label>
                    <input type="email" th:field="*{email}" required>
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:var(--red); font-size: 0.8rem; display:block; margin-top:0.3rem;"></span>
                </div>

                <div class="form-group">
                    <label>New Password <span style="color:var(--text-muted); font-weight:400;">(leave blank to keep current)</span></label>
                    <input type="password" th:field="*{password}" placeholder="Min 8 chars, uppercase, lowercase, number, symbol">
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:var(--red); font-size: 0.8rem; display:block; margin-top:0.3rem;"></span>
                </div>

                <div class="form-group">
                    <label>Confirm Password <span style="color:var(--text-muted); font-weight:400;">(if changing password)</span></label>
                    <input type="password" th:field="*{confirmPassword}" placeholder="Repeat password">
                    <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" style="color:var(--red); font-size: 0.8rem; display:block; margin-top:0.3rem;"></span>
                </div>

                <div class="form-group">
                    <label>Role <span style="color:var(--red);">*</span></label>
                    <select th:field="*{role}">
                        <option value="ADMIN">👑 Admin</option>
                        <option value="STAFF">🛠️ Staff</option>
                        <option value="USER">🎓 Student</option>
                    </select>
                </div>

                <div style="display:flex; gap:0.75rem; margin-top:0.5rem;">
                    <button type="submit" class="btn">Save Changes</button>
                    <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
