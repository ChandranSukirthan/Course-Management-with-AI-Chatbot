<div th:fragment="main">
    <div class="page-header">
        <h1>My Courses</h1>
        <a th:href="@{/courses/list}" class="btn btn-outline" style="border:1.5px solid var(--navy); color:var(--navy);">Browse All Courses</a>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(enrolledCourses)}" class="empty-state">
        <span class="empty-icon">🎒</span>
        <p>You haven't enrolled in any courses yet.</p>
        <a th:href="@{/courses/list}" class="btn btn-green" style="margin-top:1rem;">Browse Courses</a>
    </div>

    <!-- Stats bar -->
    <div th:if="${!#lists.isEmpty(enrolledCourses)}"
         style="display:flex; align-items:center; gap:0.75rem; margin-bottom:2rem;
                background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
                padding:0.75rem 1.2rem; width:fit-content; box-shadow:var(--shadow-sm);">
        <span style="font-size:1.2rem;">📝</span>
        <strong th:text="${#lists.size(enrolledCourses)}" style="font-size:1.3rem; color:var(--navy);">0</strong>
        <span style="color:var(--text-muted); font-weight:600;">Course<span th:if="${#lists.size(enrolledCourses) != 1}">s</span> enrolled</span>
    </div>

    <!-- Enrolled Courses Grid -->
    <div class="course-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(290px,1fr)); gap:1.2rem;"
         th:if="${!#lists.isEmpty(enrolledCourses)}">
        <div th:each="course, cs : ${enrolledCourses}"
             th:classappend="${cs.index % 3 == 0 ? 'green' : (cs.index % 3 == 1 ? 'yellow' : 'blue')}"
             class="course-card" style="position:relative;">

             <!-- Entire Card Link -->
             <a th:href="@{/courses/view/{id}(id=${course.id})}" style="position:absolute; top:0; left:0; right:0; bottom:0; z-index:1;"></a>

            <div style="font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; opacity:0.85; margin-bottom:0.5rem;">
                ✅ Enrolled
            </div>

            <h3 th:text="${course.title}" style="margin-bottom:0.5rem; font-size:1.05rem;">Course Title</h3>
            <p th:text="${course.description}"
               style="font-size:0.85rem; opacity:0.9; margin-bottom:1rem; line-height:1.4;
                      overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical;">
                Description
            </p>

            <div class="progress-bar-wrap" th:if="${progressMap != null}">
                <div class="progress-bar-fill" th:style="'width:' + ${progressMap.getOrDefault(course.id, 0)} + '%'"></div>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.3rem;">
                <span style="font-size:0.75rem; color:var(--text-muted); font-weight:700;" 
                      th:text="${progressMap != null ? progressMap.getOrDefault(course.id, 0) : 0} + '% Complete'">30% Complete</span>
            </div>

            <div style="margin-top:1rem; position:relative; z-index:2;">
                <a th:href="@{/courses/view/{id}(id=${course.id})}"
                   class="btn btn-sm" style="background:rgba(255,255,255,0.3); border:1px solid rgba(255,255,255,0.6); width:100%; text-align:center; display:block;">
                    Continue Learning →
                </a>
            </div>
        </div>
    </div>
</div>
