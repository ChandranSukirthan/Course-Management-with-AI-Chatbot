<div th:fragment="main" style="max-width: 800px; margin: 0 auto; padding: 2rem 0;">
    <div style="text-align: center; margin-bottom: 2.5rem;">
        <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem; color: #1a1a1a;">Edit <span style="color: #2563eb;">Your</span> Achievement</h1>
        <p style="color: #666; font-size: 1.1rem;">Update your Arduino progress</p>
        <div style="margin-top: 1.5rem;">
            <a th:href="@{/posts/feed}" class="btn btn-secondary" style="border-radius: 50px; padding: 0.6rem 1.5rem; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem;">
                ← Back to Community Feed
            </a>
        </div>
    </div>

    <div style="background: white; border-radius: 16px; border: 1px solid #e5e7eb; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden;">
        <div style="height: 6px; background: #2563eb;"></div>
        <div style="padding: 2.5rem;">
            <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; color: #111827;">Achievement Details</h2>
            <p style="font-size: 0.875rem; color: #6b7280; margin-bottom: 2rem;">Fields marked with a <span style="color: #2563eb;">dot</span> are required.</p>

            <form th:action="@{/posts/update/{id}(id=${post.id})}" th:object="${post}" method="post" enctype="multipart/form-data" id="postForm" onsubmit="return validatePostForm(event)">

                <!-- Title Field -->
                <div class="form-group" style="margin-bottom: 1.75rem;">
                    <label for="title" style="font-weight: 600; font-size: 0.9rem; color: #374151; display: flex; align-items: center; gap: 4px; margin-bottom: 0.5rem;">
                        Title <span style="color: #2563eb; font-size: 1.2rem;">•</span>
                    </label>
                    <input type="text" th:field="*{title}" id="title" required minlength="10"
                           title="Please lengthen this text to 10 characters or more"
                           placeholder="Arduino"
                           style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; transition: border-color 0.2s;"
                           onfocus="this.style.borderColor='#2563eb'; this.style.outline='none';"
                           onblur="this.style.borderColor='#d1d5db';"/>
                </div>

                <!-- Achievement Type Field -->
                <div class="form-group" style="margin-bottom: 1.75rem;">
                    <label for="achievementType" style="font-weight: 600; font-size: 0.9rem; color: #374151; display: flex; align-items: center; gap: 4px; margin-bottom: 0.5rem;">
                        Achievement Type <span style="color: #2563eb; font-size: 1.2rem;">•</span>
                    </label>
                    <div style="position: relative;">
                        <select th:field="*{achievementType}" id="achievementType" required
                                style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; appearance: none; background: #fff;">
                            <option value="">Select an option</option>
                            <option value="STREAK_7">7-Day Streak</option>
                            <option value="STREAK_30">30-Day Streak</option>
                            <option value="HARDWARE_CHALLENGE">Hardware Challenge</option>
                            <option value="MODULE_COMPLETED">Module Completed</option>
                            <option value="ARDUINO_TASK">Arduino Task Completed</option>
                            <option value="OTHER">Other</option>
                        </select>
                        <div style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); pointer-events: none; color: #6b7280;">▼</div>
                    </div>
                </div>

                <!-- Description Field -->
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label for="content" style="font-weight: 600; font-size: 0.9rem; color: #374151; display: block; margin-bottom: 0.5rem;">Description</label>
                    <textarea th:field="*{content}" id="content" rows="4" required minlength="10"
                              title="Please lengthen this text to 10 characters or more"
                              placeholder="Edit your achievement details..."
                              style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; resize: vertical; min-height: 120px;"></textarea>
                </div>

                <!-- Current Image Preview -->
                <div th:if="${post.imageUrl != null}" style="margin-bottom: 1.5rem;">
                    <p style="font-weight: 600; font-size: 0.85rem; color: #374151; margin-bottom: 0.5rem;">Current Image:</p>
                    <div style="position: relative; display: inline-block;">
                        <img th:src="${post.imageUrl}" alt="Current Achievement" style="max-width: 100%; max-height: 200px; border-radius: 8px; border: 1px solid #e5e7eb;"/>
                    </div>
                </div>

                <!-- Image Upload Field -->
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label for="imageFile" style="font-weight: 600; font-size: 0.9rem; color: #374151; display: block; margin-bottom: 0.5rem;">Update Image (Optional)</label>
                    <div style="border: 2px dashed #d1d5db; border-radius: 12px; padding: 2rem; text-align: center; background: #f9fafb; transition: all 0.2s;"
                         onmouseover="this.style.borderColor='#2563eb'; this.style.background='#f0f4ff';"
                         onmouseout="this.style.borderColor='#d1d5db'; this.style.background='#f9fafb';">
                        <input type="file" id="imageFile" name="imageFile" accept=".jpg,.jpeg,.png,.gif" style="display: none;" onchange="updateFileLabel(this)"/>
                        <label for="imageFile" style="cursor: pointer; display: block;">
                            <div style="font-size: 2rem; margin-bottom: 0.5rem;">🔄</div>
                            <div id="fileLabel" style="font-weight: 600; color: #111827;">Click to change image</div>
                            <div style="font-size: 0.75rem; color: #6b7280; margin-top: 0.25rem;">JPG, PNG, GIF — Max 20MB</div>
                        </label>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 2rem;">
                    <label for="level" style="font-weight: 600; font-size: 0.9rem; color: #374151; display: block; margin-bottom: 0.5rem;">Level / Value (0-20)</label>
                    <input type="number" th:field="*{level}" id="level" min="0" max="20" placeholder="20"
                           oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value > 20) this.value = 20;"
                           style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem;"/>
                </div>

                <!-- Public Visibility Field -->
                <div style="background: #f3f4f6; padding: 1.25rem; border-radius: 12px; margin-bottom: 2.5rem; display: flex; align-items: flex-start; gap: 1rem;">
                    <div style="display: flex; align-items: center; height: 1.5rem;">
                        <input type="checkbox" th:field="*{publiclyVisible}" id="publiclyVisible" style="width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #2563eb;">
                    </div>
                    <div>
                        <label for="publiclyVisible" style="font-weight: 700; color: #111827; cursor: pointer; display: block; margin-bottom: 0.1rem;">Make this post public</label>
                        <span style="font-size: 0.85rem; color: #4b5563;">Visible on the community home page.</span>
                    </div>
                </div>

                <!-- Actions -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <button type="submit" style="padding: 1rem; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s;">
                        💾 Save Changes
                    </button>
                    <a th:href="@{/posts/feed}" style="padding: 1rem; background: #e5e7eb; color: #374151; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer;">
                        Cancel
                    </a>
                </div>

                <div style="margin-top: 1.5rem; text-align: center;">
                    <a th:href="@{/posts/view/{id}(id=${post.id})}" style="color: #ef4444; font-size: 0.875rem; text-decoration: none; font-weight: 600;">
                        🗑️ Delete Achievement
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const titleInput = document.getElementById('title');
        const contentInput = document.getElementById('content');
        const typeInput = document.getElementById('achievementType');
        const imageFileInput = document.getElementById('imageFile');

        function validatePostForm(event) {
            let errorMsg = "";
            if (!titleInput.value || titleInput.value.length < 10) {
                errorMsg = "Title must be at least 10 characters long.";
            } else if (!typeInput.value) {
                errorMsg = "Please select an Achievement Type.";
            } else if (!contentInput.value || contentInput.value.length < 10) {
                errorMsg = "Description must be at least 10 characters long.";
            }

            if (imageFileInput.files && imageFileInput.files[0]) {
                const file = imageFileInput.files[0];
                const fileSizeInMB = file.size / (1024 * 1024);
                const fileName = file.name.toLowerCase();
                const allowedExtensions = ['jpg', 'jpeg', 'png', 'gif'];
                const extension = fileName.split('.').pop();

                if (fileSizeInMB > 20) {
                    errorMsg = "File size must be less than 20MB.";
                } else if (!allowedExtensions.includes(extension)) {
                    errorMsg = "Only JPG, PNG and GIF formats are allowed.";
                }
            }

            if (errorMsg) {
                event.preventDefault();
                Swal.fire({
                    icon: 'error',
                    title: 'Form Error',
                    text: errorMsg,
                    confirmButtonColor: '#2563eb'
                });
                return false;
            }
            return true;
        }

        function validateLength(input) {
            if (input.value.length > 0 && input.value.length < 10) {
                input.setCustomValidity('Please lengthen this text to 10 characters or more');
                input.reportValidity();
            } else {
                input.setCustomValidity('');
            }
        }

        titleInput.addEventListener('blur', () => validateLength(titleInput));
        contentInput.addEventListener('blur', () => validateLength(contentInput));

        function updateFileLabel(input) {
            const label = document.getElementById('fileLabel');
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const fileSizeInMB = file.size / (1024 * 1024);
                const fileName = file.name.toLowerCase();
                const allowedExtensions = ['jpg', 'jpeg', 'png', 'gif'];
                const extension = fileName.split('.').pop();

                if (fileSizeInMB > 20) {
                    Swal.fire({
                        icon: 'error',
                        title: 'File Too Large',
                        text: 'File size must be less than 20MB.',
                        confirmButtonColor: '#2563eb'
                    });
                    input.value = "";
                    label.innerText = "Click to change image";
                    return;
                }

                if (!allowedExtensions.includes(extension)) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Invalid Format',
                        text: 'Only JPG, PNG and GIF formats are allowed.',
                        confirmButtonColor: '#2563eb'
                    });
                    input.value = "";
                    label.innerText = "Click to change image";
                    return;
                }

                label.innerText = input.files[0].name;
                label.parentElement.parentElement.style.borderColor = '#2563eb';
                label.parentElement.parentElement.style.background = '#f0f4ff';
            }
        }
    </script>
</div>
