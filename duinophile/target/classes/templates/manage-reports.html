<div th:fragment="main">
    <div class="page-header">
        <h1>Manage Reported Comments</h1>
    </div>

    <!-- Flash Messages -->
    <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}">Error message</span>
    </div>
    <div th:if="${success}" class="alert alert-success">
        <span th:text="${success}">Success message</span>
    </div>

    <!-- Empty State -->
    <div th:if="${reports == null or #lists.isEmpty(reports)}" class="empty-state">
        <span class="empty-icon">🛡️</span>
        <p>No pending reports to manage currently.</p>
    </div>

    <!-- Reports Table -->
    <div th:if="${reports != null and !#lists.isEmpty(reports)}" class="card" style="padding: 0; overflow: hidden;">
        <table>
            <thead style="background: var(--light-blue); color: var(--navy);">
                <tr>
                    <th>Reporter</th>
                    <th>Offending Comment</th>
                    <th>Reason</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${reports}">
                    <td style="font-weight: 500;" th:text="${r.reporterName != null ? r.reporterName : 'Unknown'}">User</td>
                    <td style="max-width: 250px;">
                        <span style="font-weight:600; color:var(--blue);" th:text="'@' + ${r.commentAuthorName}"></span><br>
                        <span style="color:var(--text-muted); font-size: 0.85rem;" th:text="${r.commentContent != null ? r.commentContent : '(Deleted)'}">Content</span>
                    </td>
                    <td style="color: #d9534f; font-weight: 600;" th:text="${r.reason}">Reason</td>
                    <td style="color: var(--text-muted);" th:text="${#dates.format(r.createdAt, 'MMM dd, yyyy')}">Date</td>
                    <td>
                        <div style="display:flex; gap:0.5rem; align-items:center;">
                            <!-- Accept Action -->
                            <form th:action="@{/reports/resolve/{id}(id=${r.id})}" method="post" style="margin:0;" onsubmit="confirmDelete(event, 'This will permanently delete the offending comment and resolve the report. Proceed?')">
                                <input type="hidden" name="action" value="ACCEPT" />
                                <button type="submit" class="btn btn-red btn-sm">Accept & Delete</button>
                            </form>
                            
                            <!-- Reject Action -->
                            <form th:action="@{/reports/resolve/{id}(id=${r.id})}" method="post" onsubmit="confirmDelete(event, 'Reject this report? The comment will remain visible.')" style="margin:0;">
                                <input type="hidden" name="action" value="REJECT" />
                                <button type="submit" class="btn btn-secondary btn-sm">Reject</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
