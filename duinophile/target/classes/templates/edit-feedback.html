<div th:fragment="main">
    <div style="max-width: 500px; margin: 2rem auto;">
        <div class="form-card">
            <h2 style="color:var(--navy); margin-bottom:1.5rem;">Edit Feedback</h2>
            <form th:action="@{/feedback/update/{id}(id=${feedback.id})}" th:object="${feedback}" method="post">
                <input type="hidden" th:field="*{courseId}">
                <div class="form-group">
                    <label>Rating (1–5)</label>
                    <input type="number" th:field="*{rating}" min="1" max="5" required>
                </div>
                <div class="form-group">
                    <label>Your Review (Optional)</label>
                    <textarea th:field="*{content}" rows="4"></textarea>
                </div>
                <div style="display:flex; gap:0.75rem;">
                    <button type="submit" class="btn">Save Changes</button>
                    <a th:href="@{/feedback/course/{id}(id=${feedback.courseId})}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
