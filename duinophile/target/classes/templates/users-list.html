<div th:fragment="main">
    <div class="page-header">
        <h1>Our Scholars</h1>
        <span class="badge" style="font-size:0.8rem;">Community Members</span>
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
        <table>
            <thead>
                <tr>
                    <th>Scholar</th>
                    <th>Email</th>
                    <th>Points</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${users == null or #lists.isEmpty(users)}">
                    <td colspan="4" style="text-align:center; color:var(--text-muted); padding:2rem;">No scholars found.</td>
                </tr>
                <tr th:each="user : ${users}">
                    <td>
                        <div style="font-weight:700; color:var(--blue);" th:text="${user.username}">Username</div>
                        <div style="font-size:0.82rem; color:var(--text-muted);" th:text="${user.fullName}">Full Name</div>
                    </td>
                    <td th:text="${user.email}" style="color:var(--text-muted); font-size:0.9rem;">email@example.com</td>
                    <td><span class="badge badge-green" th:text="${user.points}">0</span></td>
                    <td>
                        <div style="display:flex; gap:0.5rem;">
                            <a th:href="@{/users/profile/{id}(id=${user.id})}" class="btn btn-sm">Profile</a>
                            <form th:action="@{/users/delete/{id}(id=${user.id})}" method="post" onsubmit="confirmDelete(event, 'Delete this user?')">
                                <button type="submit" class="btn btn-sm btn-red">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
