<div th:fragment="main">
    <div style="max-width: 420px; margin: 4rem auto;">
        <div class="form-card">
            <h2 style="text-align: center; color: var(--navy); margin-bottom: 0.5rem;">Reset Password</h2>
            <p style="text-align: center; color: var(--text-muted); font-size:0.9rem; margin-bottom: 1.5rem;">Enter your account details to verify your identity.</p>

            <div th:if="${error}" class="alert alert-error">
                <span th:text="${error}">Error</span>
            </div>

            <form th:action="@{/users/verify-identity}" method="post">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Registered Username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Registered Email" required>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Verify Identity</button>
            </form>
            <div style="text-align: center; margin-top: 1rem;">
                <a th:href="@{/users/login}" style="color: var(--blue); font-weight: 600; font-size: 0.9rem; text-decoration:none;">Back to Login</a>
            </div>
        </div>
    </div>
</div>
