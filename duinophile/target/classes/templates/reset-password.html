<div th:fragment="main">
    <div style="max-width: 420px; margin: 4rem auto;">
        <div class="form-card">
            <h2 style="text-align: center; color: var(--navy); margin-bottom: 0.5rem;">Create New Password</h2>
            <p style="text-align: center; color: var(--text-muted); font-size:0.9rem; margin-bottom: 1.5rem;">Your identity is verified. Please enter a strong new password.</p>

            <div th:if="${error}" class="alert alert-error" style="line-height:1.4;">
                <span th:text="${error}">Error</span>
            </div>

            <form th:action="@{/users/reset-password}" method="post">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="newPassword" placeholder="8+ chars, upper, lower, digit, special" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirmPassword" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Reset & Login</button>
            </form>
        </div>
    </div>
</div>
