<div th:fragment="main">
    <div class="page-header"><h1>Community Feed</h1></div>

    <!-- Flash Messages -->
    <div th:if="${error}" style="background-color: #fee; border: 1.5px solid #fcc; color: var(--red); padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-weight: 600; font-size: 0.9rem;">
        <span th:text="${error}">Error message</span>
    </div>
    <div th:if="${success}" style="background-color: #eefbee; border: 1.5px solid #cceccc; color: var(--green); padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-weight: 600; font-size: 0.9rem;">
        <span th:text="${success}">Success message</span>
    </div>

    <div style="max-width: 680px; margin: 2rem auto;">

        <!-- Create Post Bar (Visible for everyone) -->
        <div th:if="${currentUser != null}" style="margin-bottom: 2.5rem; background: white; padding: 1.25rem; border-radius: 16px; border: 1.5px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; align-items: center; gap: 1rem;">
            <div style="width: 45px; height: 45px; background: #eff6ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;">✨</div>
            <a th:href="@{/posts/create}" style="flex: 1; padding: 0.85rem 1.25rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 999px; color: #64748b; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: all 0.2s; cursor: pointer;" onmouseover="this.style.borderColor='#cbd5e1'; this.style.background='#fff';">
                Share your latest achievement...
            </a>
            <a th:if="${currentUser.role == 'ADMIN' or currentUser.role == 'STAFF'}" th:href="@{/posts/manage}"
               style="background: #fff7ed; color: #f97316; border: 1.5px solid #ffedd5; border-radius: 999px; padding: 0.6rem 1.25rem; text-decoration: none; font-weight: 800; font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem; white-space: nowrap; transition: all 0.2s;"
               onmouseover="this.style.background='#ffedd5';">
                ⚖️ Manage Queue
            </a>
        </div>

        <!-- Community Feed Title -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem;">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <span style="font-size: 1.5rem;">🏆</span>
                <h2 style="color: var(--navy); margin: 0; font-size: 1.6rem; font-weight: 900; letter-spacing: -0.02em;">Community <span style="color: var(--blue);">Home</span></h2>
            </div>
            <span style="font-size: 0.85rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;" th:text="${#lists.size(posts) + ' ACHIEVEMENTS'}">0 ACHIEVEMENTS</span>
        </div>

        <!-- Feed List -->
        <div style="display:flex; flex-direction:column; gap:1.5rem;" th:if="${posts != null and !#lists.isEmpty(posts)}">
            <div th:each="post, ps : ${posts}" class="post-row" th:style="'animation-delay:' + ${ps.index * 0.05} + 's'">
                <!-- Post Header -->
                <div style="margin-bottom: 1rem;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.5rem;">
                        <div style="display:flex; align-items:center; gap:0.6rem;">
                            <div style="width: 32px; height: 32px; background: #f1f5f9; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; border: 1.5px solid #e2e8f0; font-weight: 900; color: #64748b;" th:text="${#strings.substring(post.authorName != null ? post.authorName : 'S', 0, 1).toUpperCase()}">U</div>
                            <span style="font-weight:800; color:var(--navy); font-size:1.05rem;" th:text="'@' + ${post.authorName != null ? post.authorName : 'Scholar'}">@username</span>
                            <a th:if="${post.authorId != null}" th:href="@{/users/profile/{id}(id=${post.authorId})}" style="font-size:0.75rem; color:var(--blue); text-decoration:none; font-weight:700; margin-left: 0.25rem;">View Profile</a>
                        </div>
                        <span style="font-size:0.8rem; color:var(--text-muted); font-weight: 600;" th:text="${#temporals.format(post.createdAt, 'MMM d, h:mm a')}">Time</span>
                    </div>

                    <!-- Title -->
                    <h4 th:text="${post.title}" style="margin: 0 0 0.65rem 0; color: #111827; font-weight: 800; font-size: 1.35rem; line-height: 1.3;">Achievement Title</h4>

                    <!-- Badges -->
                    <div style="display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.5rem;">
                        <span th:if="${post.achievementType != null and !post.achievementType.isEmpty()}"
                              style="background: #f1f5f9; color: #475569; font-size: 0.75rem; font-weight: 750; padding: 0.25rem 0.75rem; border-radius: 6px; border: 1px solid #e2e8f0; text-transform: uppercase; letter-spacing: 0.02em;"
                              th:text="${post.achievementType}">TYPE</span>
                        <span th:if="${post.level != null}"
                              style="background: #ecfdf5; color: #059669; font-size: 0.75rem; font-weight: 750; padding: 0.25rem 0.75rem; border-radius: 6px; border: 1px solid #10b98140;"
                              th:text="'LVL ' + ${post.level}">LVL</span>
                    </div>
                </div>

                <p class="post-content" th:text="${post.content}" style="margin:0 0 1.25rem 0; color:#334155; font-size:1.05rem; line-height:1.6;">Post content</p>

                <div th:if="${post.imageUrl != null}" style="margin-bottom: 1.5rem;">
                    <img th:src="${post.imageUrl}" alt="Post Image" style="max-width: 100%; max-height: 500px; border-radius: 16px; border: 1.5px solid var(--border); box-shadow: 0 10px 20px rgba(0,0,0,0.04);" />
                </div>

                <!-- Footer Actions -->
                <div style="display:flex; justify-content:space-between; align-items:center; border-top:1.5px solid #f1f5f9; padding-top:1.25rem;">
                    <div style="display:flex; gap:0.75rem;">
                        <form th:action="@{/posts/react/{id}(id=${post.id})}" method="post">
                            <input type="hidden" name="type" value="like">
                            <button type="submit" class="action-btn-p pill-btn" th:style="${post.reactions != null and currentUser != null and post.reactions.get('like') != null and post.reactions.get('like').contains(currentUser.id()) ? 'background:#eff6ff; color:#2563eb; border-color:#2563eb; font-weight:800; border-radius:999px; padding: 0.5rem 1rem; border: 1.5px solid #dbeafe; cursor:pointer; display:flex; align-items:center; gap:0.4rem;' : 'background:#fff; color:#64748b; border: 1.5px solid #e2e8f0; border-radius:999px; padding: 0.5rem 1rem; cursor:pointer; display:flex; align-items:center; gap:0.4rem;'}">
                                <span>👍</span> <span th:text="${post.reactions != null and post.reactions.get('like') != null ? post.reactions.get('like').size() : 0}">0</span>
                            </button>
                        </form>
                        <form th:action="@{/posts/react/{id}(id=${post.id})}" method="post">
                            <input type="hidden" name="type" value="love">
                            <button type="submit" class="action-btn-p pill-btn" th:style="${post.reactions != null and currentUser != null and post.reactions.get('love') != null and post.reactions.get('love').contains(currentUser.id()) ? 'background:#fef2f2; color:#ef4444; border-color:#ef4444; font-weight:800; border-radius:999px; padding: 0.5rem 1rem; border: 1.5px solid #fee2e2; cursor:pointer; display:flex; align-items:center; gap:0.4rem;' : 'background:#fff; color:#64748b; border: 1.5px solid #e2e8f0; border-radius:999px; padding: 0.5rem 1rem; cursor:pointer; display:flex; align-items:center; gap:0.4rem;'}">
                                <span>❤️</span> <span th:text="${post.reactions != null and post.reactions.get('love') != null ? post.reactions.get('love').size() : 0}">0</span>
                            </button>
                        </form>
                    </div>

                    <div style="display:flex; gap:0.6rem; align-items:center;">
                        <button type="button" th:data-postid="${post.id}" th:data-title="${post.title}"
                                onclick="sharePost(this.getAttribute('data-postid'), this.getAttribute('data-title'))"
                                style="background:#fff; border: 1.5px solid #e2e8f0; padding:0.45rem 1.15rem; color:#64748b; border-radius:999px; display:inline-flex; align-items:center; gap:0.5rem; font-size:0.85rem; font-weight:800; cursor:pointer; transition: all 0.2s;"
                                onmouseover="this.style.background='#f8fafc'; this.style.borderColor='#cbd5e1';">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                            Share
                        </button>
                    </div>
                </div>
                <!-- COMMENTS SECTION -->
                <div style="margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem;">
                    <!-- Comments Toggle -->
                    <div th:if="${post.comments != null and !#lists.isEmpty(post.comments)}" style="margin-bottom: 0.8rem;">
                        <button type="button" class="btn btn-secondary btn-sm" th:data-postid="${post.id}" onclick="toggleComments(this.getAttribute('data-postid'))" style="font-size:0.8em; padding: 0.35rem 0.8rem; background: transparent; border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; border-radius: 999px;">
                            Show All Comments (<span th:text="${#lists.size(post.comments)}"></span>)
                        </button>
                    </div>

                    <div th:id="'comments-' + ${post.id}" style="display:none; flex-direction:column; gap:0.6rem;" th:if="${post.comments != null and !#lists.isEmpty(post.comments)}">
                        <div th:each="comment, cs : ${post.comments}" th:style="${comment.content != null and #strings.startsWith(comment.content, '@')} ? 'margin-left: 5rem; padding-left: 1rem; border-left: 3px solid var(--blue); margin-bottom: 0.5rem; padding-top: 0.3rem;' : 'margin-left: 2.5rem; padding-left: 1rem; border-left: 2px solid var(--border); margin-bottom: 0.5rem; padding-top: 0.3rem;'">
                            <div class="post-author" style="font-size: 0.85em;" th:text="'@' + ${comment.authorName != null ? comment.authorName : 'Scholar'}">@username</div>
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span class="post-content" style="font-size: 0.9em;" th:text="${comment.content}">Reply text</span>
                                <div style="display:flex; gap:0.4rem; align-items:center;">
                                    <button type="button" class="btn" th:data-postid="${post.id}" th:data-author="${comment.authorName != null ? comment.authorName : 'Scholar'}" onclick="replyToComment(this.getAttribute('data-postid'), this.getAttribute('data-author'))" style="font-size: 0.7em; padding: 0.2rem 0.5rem; background: transparent; color: var(--blue); border: 1px solid var(--blue); cursor: pointer;">Reply</button>
                                    <button type="button" class="btn" th:data-commentid="${comment.id}" onclick="reportComment(this.getAttribute('data-commentid'))" style="font-size: 0.7em; padding: 0.2rem 0.5rem; background: transparent; color: #ed8936; border: 1px solid #ed8936; cursor: pointer;">Report</button>
                                    <a th:if="${currentUser != null and currentUser.id == comment.authorId}" th:href="@{/comments/edit/{id}(id=${comment.id})}" class="btn" style="font-size: 0.7em; padding: 0.2rem 0.5rem; background: transparent; color: var(--text-muted); border: 1px solid var(--border); text-decoration: none;">Edit</a>
                                    <form th:if="${currentUser != null and (currentUser.id == comment.authorId or currentUser.role == 'ADMIN' or currentUser.role == 'STAFF')}" th:action="@{/comments/delete/{id}(id=${comment.id})}" method="post" onsubmit="confirmDelete(event, 'Delete comment?')">
                                        <button type="submit" class="btn" style="font-size: 0.7em; padding: 0.2rem 0.5rem; background: transparent; color: var(--red); border: 1px solid var(--red);">Delete</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Comment Input -->
                    <form th:action="@{/comments/create}" method="post" style="display:flex; gap:0.5rem; margin-top: 0.8rem;">
                        <input type="hidden" name="postId" th:value="${post.id}">
                        <input type="text" th:id="'comment-input-' + ${post.id}" name="content" placeholder="Write a comment..." required style="flex:1; font-size: 0.85em; padding: 0.4rem 1rem; border: 1px solid var(--border); border-radius: 999px;">
                        <button type="submit" class="btn" style="font-size: 0.85em; padding: 0.4rem 1.25rem; border-radius: 999px;">Add Comment</button>
                    </form>
                </div>
            </div>
        </div>

        <script>
            function toggleComments(postId) {
                const el = document.getElementById('comments-' + postId);
                if (el) {
                    if (el.style.display === 'none') {
                        el.style.display = 'flex';
                    } else {
                        el.style.display = 'none';
                    }
                }
            }
            function replyToComment(postId, username) {
                const input = document.getElementById('comment-input-' + postId);
                if (input) {
                    input.value = '@' + username + ' ';
                    input.focus();
                }
                const commentsDiv = document.getElementById('comments-' + postId);
                if (commentsDiv && commentsDiv.style.display === 'none') {
                    commentsDiv.style.display = 'flex';
                }
            }

            function reportComment(commentId) {
                Swal.fire({
                    title: 'Report Comment',
                    input: 'textarea',
                    inputLabel: 'Reason for reporting',
                    inputPlaceholder: 'Why is this inappropriate?',
                    showCancelButton: true,
                    confirmButtonText: 'Submit for review',
                    confirmButtonColor: '#ed8936',
                    inputValidator: (value) => {
                        if (!value) {
                            return 'You need to write a reason!'
                        }
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        const form = document.createElement('form');
                        form.method = 'POST';
                        form.action = '/reports/create';

                        const commentIdInput = document.createElement('input');
                        commentIdInput.type = 'hidden';
                        commentIdInput.name = 'commentId';
                        commentIdInput.value = commentId;
                        form.appendChild(commentIdInput);

                        const reasonInput = document.createElement('input');
                        reasonInput.type = 'hidden';
                        reasonInput.name = 'reason';
                        reasonInput.value = result.value;
                        form.appendChild(reasonInput);

                        document.body.appendChild(form);
                        form.submit();
                    }
                });
            }
            async function sharePost(postId, title) {
                const url = window.location.origin + '/posts/view/' + postId;
                const shareData = {
                    title: title || 'Check out this achievement on Duinophile!',
                    text: 'Exciting achievement shared on Duinophile!',
                    url: url
                };

                try {
                    if (navigator.share) {
                        await navigator.share(shareData);
                    } else {
                        await navigator.clipboard.writeText(url);
                        Swal.fire({
                            icon: 'success',
                            title: 'Link Copied!',
                            text: 'Link copied to clipboard (Web Share not supported).',
                            timer: 1500,
                            showConfirmButton: false,
                            toast: true,
                            position: 'top-end'
                        });
                    }
                } catch (err) {
                    console.error('Error sharing:', err);
                }
            }
        </script>
    </div>
