<div th:fragment="main">
    <div style="max-width: 640px; margin: 2rem auto;">
        <div class="form-card">
            <div style="margin-bottom:1.2rem;">
                <a th:href="@{/courses/view/{id}(id=${course.id})}" class="btn btn-secondary" style="display:inline-flex; align-items:center; gap:0.4rem; font-size:0.9rem;">← Back</a>
            </div>
            <h2 style="color:var(--navy); margin-bottom:1.5rem;">Edit Course</h2>
            <form th:action="@{/courses/update/{id}(id=${course.id})}" th:object="${course}" method="post">
                <div class="form-group">
                    <label>Course Name</label>
                    <input type="text" th:field="*{title}" required>
                    <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color:var(--red); font-size:0.75rem; font-weight:700; display:block; margin-top:0.3rem; line-height:1.2;"></span>
                </div>
                <div class="form-group">
                    <label>Course Description</label>
                    <textarea th:field="*{description}" rows="4" required></textarea>
                    <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color:var(--red); font-size:0.75rem; font-weight:700; display:block; margin-top:0.3rem; line-height:1.2;"></span>
                </div>

                <div class="form-group">
                    <label>Minimum Points Required to Enroll</label>
                    <input type="number" th:field="*{minimumPointsRequired}" min="0" required>
                    <span th:if="${#fields.hasErrors('minimumPointsRequired')}" th:errors="*{minimumPointsRequired}" style="color:var(--red); font-size:0.75rem; font-weight:700; display:block; margin-top:0.3rem;"></span>
                </div>

                <!-- 3-Stage Level Selector -->
                <div class="form-group">
                    <label style="margin-bottom:0.75rem; display:block;">Course Level</label>
                    <div style="display:grid; grid-template-columns: repeat(3,1fr); gap:0.75rem;">

                        <label class="level-card" style="cursor:pointer;">
                            <input type="radio" th:field="*{level}" value="BEGINNER" style="display:none;">
                            <div class="level-option"
                                 style="border:2px solid var(--border); border-radius:12px; padding:1rem 0.6rem;
                                        text-align:center; transition:all 0.2s ease; background:var(--surface);">
                                <div style="font-size:1.8rem; margin-bottom:0.4rem;">🌱</div>
                                <div style="font-weight:700; color:var(--green); font-size:0.85rem;">Beginner</div>
                            </div>
                        </label>

                        <label class="level-card" style="cursor:pointer;">
                            <input type="radio" th:field="*{level}" value="INTERMEDIATE" style="display:none;">
                            <div class="level-option"
                                 style="border:2px solid var(--border); border-radius:12px; padding:1rem 0.6rem;
                                        text-align:center; transition:all 0.2s ease; background:var(--surface);">
                                <div style="font-size:1.8rem; margin-bottom:0.4rem;">⚡</div>
                                <div style="font-weight:700; color:var(--blue); font-size:0.85rem;">Intermediate</div>
                            </div>
                        </label>

                        <label class="level-card" style="cursor:pointer;">
                            <input type="radio" th:field="*{level}" value="ADVANCED" style="display:none;">
                            <div class="level-option"
                                 style="border:2px solid var(--border); border-radius:12px; padding:1rem 0.6rem;
                                        text-align:center; transition:all 0.2s ease; background:var(--surface);">
                                <div style="font-size:1.8rem; margin-bottom:0.4rem;">🔥</div>
                                <div style="font-weight:700; color:#e03131; font-size:0.85rem;">Advanced</div>
                            </div>
                        </label>

                    </div>
                </div>

                <div class="form-group">
                    <label style="display:flex; align-items:center; gap:0.5rem; font-weight:600; color:var(--text-main);">
                        <input type="checkbox" th:field="*{completed}" style="width:auto;"> Mark as Completed
                    </label>
                </div>

                <div style="display:flex; gap:0.75rem;">
                    <button type="submit" class="btn">Save Changes</button>
                    <a th:href="@{/courses/view/{id}(id=${course.id})}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <style>
        .level-card input[type="radio"]:checked + .level-option {
            border-color: var(--navy) !important;
            background: var(--navy) !important;
            box-shadow: 0 4px 16px rgba(26,26,46,0.2);
            transform: translateY(-3px);
        }
    </style>
</div>
