<div th:fragment="main">
    <div class="page-header">
        <h1>My Reports</h1>
    </div>

    <!-- Empty State -->
    <div th:if="${reports == null or #lists.isEmpty(reports)}" class="empty-state">
        <span class="empty-icon">🚩</span>
        <p>You haven't submitted any reports yet.</p>
    </div>

    <!-- Reports Grid (Student Theme) -->
    <div class="course-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(290px,1fr)); gap:1.2rem;" th:if="${reports != null and !#lists.isEmpty(reports)}">
        <div th:each="r, stat : ${reports}" 
             th:classappend="${stat.index % 3 == 0 ? 'blue' : (stat.index % 3 == 1 ? 'yellow' : 'red')}" 
             class="course-card" style="padding: 1.5rem; position: relative;">
            
            <div style="font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; opacity:0.9; margin-bottom:0.75rem;">
                <span th:if="${r.status == 'PENDING'}">⏳ In Review</span>
                <span th:if="${r.status == 'ACCEPTED'}">✅ Accepted & Removed</span>
                <span th:if="${r.status == 'REJECTED'}">❌ Rejected</span>
            </div>

            <h3 style="margin-bottom:0.8rem; font-size:1.15rem; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 0.8rem; display: flex; align-items: center; gap: 0.4rem;">
                <span style="font-weight:400; font-size: 0.9em; opacity: 0.8;">Reported:</span>
                <span style="font-weight:700; letter-spacing: -0.01em;" th:text="'@' + ${r.commentAuthorName}"></span>
            </h3>

            <p style="font-size:0.85rem; opacity:0.9; margin-bottom:0.5rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                "<span th:text="${r.commentContent != null ? r.commentContent : '(Deleted by Staff)'}"></span>"
            </p>

            <div style="background: rgba(0,0,0,0.15); border-radius: var(--radius-sm); padding: 0.85rem; margin-top: 1rem; margin-bottom: 1rem;">
                <strong style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.7;">Your Reason</strong>
                <p style="font-size:0.9rem; margin-top: 0.2rem; font-weight: 500;" th:text="${r.reason}"></p>
            </div>

            <div style="display:flex; justify-content:flex-end; align-items:center; margin-top:0.3rem;">
                <span style="font-size:0.75rem; font-weight:700; opacity: 0.7;" th:text="${#dates.format(r.createdAt, 'MMM dd, yyyy')}">Date</span>
            </div>
        </div>
    </div>
</div>
