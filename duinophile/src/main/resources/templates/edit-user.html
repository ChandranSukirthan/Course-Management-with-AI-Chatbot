<div th:fragment="main">
    <div style="max-width: 500px; margin: 2rem auto;">
        <div class="form-card">
            <h2 style="color:var(--navy); margin-bottom:1.5rem;">Edit Profile</h2>
            <form th:action="@{/users/update/{id}(id=${user.id})}" th:object="${user}" method="post">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" th:field="*{username}" readonly>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" required>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" th:field="*{fullName}">
                </div>
                <div class="form-group">
                    <label>New Password (Optional)</label>
                    <input type="password" th:field="*{password}" placeholder="Leave blank to keep current">
                </div>
                <div style="display:flex; gap:0.75rem;">
                    <button type="submit" class="btn">Update Profile</button>
                    <a th:href="@{/users/profile/{id}(id=${user.id})}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
