<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Chatbot - AI Tech Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #FFD700 0%, #DAA520 100%);
            --bg-color: #fffdf2;
            --chat-bg: #ffffff;
            --user-msg-bg: #DAA520;
            --bot-msg-bg: #fffbf0;
            --text-color: #4a3e1a;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            height: 100vh;
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: var(--primary-gradient);
            padding: 15px 20px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bot-avatar {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 90%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.9rem;
        }

        .user-message {
            align-self: flex-end;
            background: var(--user-msg-bg);
            color: white;
        }

        .bot-message {
            align-self: flex-start;
            background: var(--bot-msg-bg);
            color: var(--text-color);
            border: 1px solid #fcf2d1;
        }

        .chat-input-area {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #eee;
        }

        .input-group {
            background: #f1f8f4;
            padding: 5px;
            border-radius: 15px;
        }

        .form-control {
            background: transparent;
            border: none;
        }

        .send-btn {
            background: var(--primary-gradient);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            color: white;
        }

        .typing-indicator {
            display: none;
            color: #DAA520;
            font-size: 0.9rem;
            margin-bottom: 10px;
            padding-left: 20px;
        }

        .dot-pulse {
            position: relative;
            left: -9999px;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #313d36;
            box-shadow: 9999px 0 0 0 #7df8b0;
            animation: dotPulse 1.5s infinite linear;
        }

        @keyframes dotPulse {
            0% { box-shadow: 9999px 0 0 -5px #DAA520; }
            30% { box-shadow: 9999px 0 0 2px #DAA520; }
            60%, 100% { box-shadow: 9999px 0 0 -5px #DAA520; }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        <div class="header-info">
            <div class="bot-avatar">
                <i class="fas fa-microchip"></i>
            </div>
            <div>
                <h6 class="m-0 fw-bold">Hardware AI Assistant</h6>
                <small style="font-size: 11px;"><i class="fas fa-circle text-success me-1" style="font-size:7px;"></i> Tech Support</small>
            </div>
        </div>
    </div>

    <div class="chat-messages" id="messageArea">
        <div class="message bot-message">
            Hello! I am your Hardware AI assistant. Ask me about PC parts, errors, or troubleshooting.
        </div>
    </div>

    <div id="typing" class="typing-indicator mx-4">
        AI is analyzing your issue <span class="dot-pulse"></span>
    </div>

    <div class="chat-input-area">
        <form id="messageForm" class="d-flex gap-2">
            <div class="input-group flex-grow-1">
                <input type="text" id="text" name="msg" class="form-control"
                       placeholder="Describe your hardware issue (e.g., PC not turning on, GPU problem...)"
                       required autocomplete="off">
            </div>
            <button type="submit" id="send" class="send-btn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    $(document).ready(function() {

        $("#messageForm").on("submit", function(event) {
            event.preventDefault();

            const date = new Date();
            const str_time = date.getHours() + ":" + (date.getMinutes() < 10 ? '0' : '') + date.getMinutes();

            const rawText = $("#text").val();

            const userHtml = `<div class="message user-message">${rawText}
                <div style="font-size:10px; text-align:right;">${str_time}</div></div>`;

            $("#text").val("");
            $("#messageArea").append(userHtml);
            scrollToBottom();

            $("#typing").show();

            $.ajax({
                data: { msg: rawText },
                type: "POST",
                url: "/get",
            }).done(function(data) {
                $("#typing").hide();

                const botHtml = `<div class="message bot-message">${data}
                    <div style="font-size:10px;">${str_time}</div></div>`;

                $("#messageArea").append(botHtml);
                scrollToBottom();
            });
        });

        function scrollToBottom() {
            const messageArea = document.getElementById("messageArea");
            messageArea.scrollTop = messageArea.scrollHeight;
        }

    });
</script>

</body>
</html>
