<div th:fragment="main">
    <div style="max-width: 560px; margin: 2rem auto;">
        <div class="form-card">
            <div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:1.75rem;">
                <a th:href="@{/admin/dashboard}" class="btn btn-sm btn-secondary">← Back</a>
                <h2 style="margin:0; color:var(--navy);">Add New User</h2>
            </div>

            <div th:if="${error}" class="alert alert-error">⚠️ <span th:text="${error}">Error</span></div>

            <form th:action="@{/admin/add-user}" th:object="${newUser}" method="post">
                <!-- Role selector — shown first so admin picks role upfront -->
                <div class="form-group">
                    <label>Role <span style="color:var(--red);">*</span></label>
                    <select name="targetRole" required>
                        <option value="ADMIN">👑 Admin</option>
                        <option value="STAFF">🛠️ Staff</option>
                        <option value="USER" selected>🎓 Student</option>
                    </select>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" th:field="*{fullName}" placeholder="e.g., Jane Doe">
                    </div>
                    <div class="form-group">
                        <label>Username <span style="color:var(--red);">*</span></label>
                        <input type="text" th:field="*{username}" placeholder="e.g., janedoe" th:classappend="${#fields.hasErrors('username')} ? 'input-error' : ''" required>
                        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error-text"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email <span style="color:var(--red);">*</span></label>
                    <input type="email" th:field="*{email}" placeholder="email@example.com" th:classappend="${#fields.hasErrors('email')} ? 'input-error' : ''" required>
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-text"></span>
                </div>

                <div class="form-group">
                    <label>Password <span style="color:var(--red);">*</span></label>
                    <input type="password" th:field="*{password}"
                        placeholder="Min 8 chars, uppercase, lowercase, number, symbol" th:classappend="${#fields.hasErrors('password')} ? 'input-error' : ''" required>
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-text"></span>
                </div>

                <div class="form-group">
                    <label>Confirm Password <span style="color:var(--red);">*</span></label>
                    <input type="password" th:field="*{confirmPassword}" placeholder="Repeat password" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'input-error' : ''" required>
                    <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="error-text"></span>
                </div>

                <div style="display:flex; gap:0.75rem; margin-top:0.5rem;">
                    <button type="submit" class="btn btn-green">Create User</button>
                    <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
