<div th:fragment="main">

    <!-- Header Bar -->
    <div class="header-roadmap">
        <div style="display:flex; align-items:center; gap:1rem;">
            <a href="/courses/list" class="btn-roadmap" style="font-size:0.85rem; padding:0.4rem 0.9rem;">← All Courses</a>
            <span class="header-title" th:text="${course.title}">Course Name</span>
        </div>
        <div class="header-actions">
            <a th:if="${currentUser != null and (currentUser.role == 'ADMIN' or currentUser.role == 'STAFF')}"
               th:href="@{/lessons/create/{courseId}(courseId=${course.id})}"
               class="btn-roadmap">Add Lesson</a>

            <!-- Edit Course -->
            <a th:if="${currentUser != null and (currentUser.role == 'ADMIN' or currentUser.role == 'STAFF')}"
               th:href="@{/courses/edit/{id}(id=${course.id})}"
               class="btn-roadmap">Edit Course</a>
               
            <!-- Delete Course -->
            <form th:if="${currentUser != null and (currentUser.role == 'ADMIN' or currentUser.role == 'STAFF')}"
                  th:action="@{/courses/delete/{id}(id=${course.id})}" method="post"
                  onsubmit="confirmDelete(event, 'Delete this entire course?')" style="display:inline;">
                <button type="submit" class="btn btn-sm btn-red">Delete Course</button>
            </form>
        </div>
    </div>

    <!-- ===== ROADMAP VIEW ===== -->
    <div class="roadmap-container">
        <!-- Loop lessons -->
        <div th:each="lesson, ls : ${lessons}" class="roadmap-block" 
             th:classappend="${ls.index % 2 == 0 ? 'align-left' : 'align-right'}">
            
            <div th:if="${!ls.first}" class="path-line"></div>

            <!-- Single Combined Lesson Card -->
            <div class="road-card-simple lesson-card-style">
                <!-- Card Icon -->
                <div class="card-icon" th:with="icons=${ {'🔌', '💡', '🤖', '⚙️', '💻', '🔋', '📡', '🛠️', '🕹️', '📟'} }">
                    <span style="font-size: 2.5rem;" th:text="${icons[ls.index % icons.size()]}">🔌</span>
                </div>

                <div class="card-text">
                    <div class="card-label">Lesson <span th:text="${ls.count}">1</span></div>
                    <div class="card-title" th:text="${lesson.title}">Lesson Title</div>
                    
                    <!-- Integrated Quiz Status Badge -->
                    <div th:if="${lesson.quiz != null and !#lists.isEmpty(lesson.quiz)}" class="quiz-badge">
                        <span class="quiz-icon">📝</span>
                        <span th:with="totalPoints=${#aggregates.sum(lesson.quiz.![points])}" 
                              th:text="${totalPoints} + ' Pts Quiz'">10 Pts Quiz</span>
                    </div>

                    <!-- Completed Badge -->
                    <div th:if="${completedLessonIds != null and completedLessonIds.contains(lesson.id)}" 
                         style="background:var(--green); width:32px; height:32px; border-radius:50%; display:flex; 
                                align-items:center; justify-content:center; position:absolute; top:-10px; right:-10px; 
                                border:3px solid white; box-shadow:0 3px 8px rgba(0,0,0,0.2); z-index:2; font-size:0.85rem;">
                         ✅
                    </div>
                </div>

                <!-- Link to Lesson View (where management buttons are) -->
                <a th:href="@{/lessons/view/{id}(id=${lesson.id})}" class="card-overlay-link"></a>
            </div>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(lessons)}" style="text-align:center; padding:4rem; color:var(--text-muted); font-size:1.1rem;">
            <span>No lessons yet.</span>
            <span th:if="${currentUser != null and (currentUser.role == 'ADMIN' or currentUser.role == 'STAFF')}">
                Click <strong>Add Lesson</strong> above!
            </span>
        </div>
    </div>
    
    <!-- ===== COURSE REVIEWS ===== -->
    <div id="course-reviews" style="max-width: 850px; margin: 0 auto; padding-top: 2rem; padding-bottom: 3rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2 style="font-size: 1.6rem; font-weight: 800; margin: 0;">Course Reviews</h2>
            <a th:href="@{/feedback/course/{courseId}(courseId=${course.id})}" 
               style="display: inline-block; background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 700; font-size: 0.95rem; text-decoration: none; cursor: pointer; transition: 0.2s;">
               + Leave a Review
            </a>
        </div>

        <!-- Existing Feedback Cards -->
        <div th:if="${feedbacks == null or #lists.isEmpty(feedbacks)}" style="color: var(--text-muted); font-size:0.95rem; text-align: center; padding: 2rem; background: var(--surface-hover); border-radius: 12px; border: 1px solid var(--border);">
            No reviews yet. Be the first to share your thoughts!
        </div>

        <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.2rem;" th:if="${feedbacks != null and !#lists.isEmpty(feedbacks)}">
            <div th:each="fb : ${feedbacks}" style="background: var(--surface-hover); border-radius: 12px; padding: 1.2rem; box-shadow: var(--shadow-sm); border: 1px solid var(--border);">
                <div style="margin-bottom:0.6rem; display:flex; align-items:center; justify-content:space-between;">
                    <div>
                        <span th:each="i : ${#numbers.sequence(1, fb.rating)}" style="color: #f39c12; font-size: 1.3em;">★</span>
                    </div>

                </div>
                <p th:if="${fb.content != null and !#strings.isEmpty(fb.content)}" th:text="${fb.content}" style="font-size:0.92rem; margin-bottom:1rem; color: var(--text-main); line-height: 1.4;"></p>
                <div style="display:flex; justify-content:space-between; align-items:center; border-top: 1px solid var(--border); padding-top: 0.8rem;">
                    <span style="font-size:0.8rem; color: var(--text-muted); font-weight: 600;" th:text="'— ' + ${fb.username != null ? fb.username : 'Scholar'}"></span>
                    
                    <div style="display:flex; gap:0.5rem; align-items:center;">
                        <a th:if="${currentUser != null and currentUser.id == fb.userId}" th:href="@{/feedback/edit/{id}(id=${fb.id})}" style="background: transparent; color: #6c757d; border: 1px solid #ccc; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-decoration: none;">Edit</a>
                        <form th:if="${currentUser != null and (currentUser.id == fb.userId or currentUser.role == 'ADMIN' or currentUser.role == 'STAFF')}" th:action="@{/feedback/delete/{id}(id=${fb.id})}" method="post" onsubmit="confirmDelete(event, 'Delete feedback?')" style="margin:0;">
                            <button type="submit" style="background: transparent; color: #dc3545; border: 1px solid #dc3545; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; cursor: pointer;">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* Styles match screenshot look-and-feel */
        .header-roadmap {
            background: var(--surface-hover); border: 1px solid var(--border); border-radius: 14px; padding: 0.8rem 1.5rem;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;
        }
        .header-title { color: var(--text-main); font-weight: 800; font-size: 1.4rem; }
        .header-actions { display: flex; gap: 1rem; }
        .btn-roadmap {
            background: var(--primary); color: white; border: none;
            padding: 0.5rem 1.2rem; border-radius: 10px; font-weight: 700;
            text-decoration: none; transition: 0.2s; cursor: pointer; font-size: 0.9rem;
        }
        .btn-roadmap:hover { background: var(--secondary); transform: translateY(-2px); }
        .btn-red-hover:hover { background: var(--error); color: white; border-color: var(--error); }

        .roadmap-container { max-width: 850px; margin: 0 auto; padding-bottom: 5rem; position: relative;}
        .roadmap-block { display: flex; margin-bottom: 4.5rem; position: relative; }
        .align-left { justify-content: flex-start; }
        .align-right { justify-content: flex-end; }

        .path-line {
            position: absolute; top: -4.5rem; left: 100px; width: 3px; height: 4.5rem;
            background: #e0e0e0; z-index: 0;
        }
        .align-right .path-line { left: auto; right: 100px; }

        .road-card-simple {
            width: 220px;
            background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-top: 1px solid rgba(255,255,255,0.15);
            border-left: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 1.6rem 1.2rem; display: flex; flex-direction: column;
            align-items: center; text-align: center; position: relative;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer; text-decoration: none; color: var(--text-main); z-index: 1;
            overflow: hidden;
        }

        .road-card-simple::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
            transform: skewX(-20deg); transition: 0.6s;
        }

        .road-card-simple:hover { 
            transform: translateY(-10px) scale(1.02); 
            box-shadow: 0 15px 40px rgba(0,0,0,0.35); 
            border-color: rgba(255,255,255,0.25); 
        }
        
        .road-card-simple:hover::before {
            left: 150%;
        }

        .card-icon {
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(0,0,0,0.1));
            width: 85px; height: 85px; border-radius: 22px; 
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 1.2rem; display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.05), 0 8px 20px rgba(0,0,0,0.3);
        }
        


        .card-label { font-size: 0.75rem; font-weight: 900; color: #00d2ff; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.12em;}
        .card-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 1rem; line-height: 1.3; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        
        .quiz-badge {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            padding: 0.4rem 0.9rem; border-radius: 20px;
            font-size: 0.75rem; font-weight: 800; color: #fff;
            display: inline-flex; align-items: center; gap: 0.4rem; 
            backdrop-filter: blur(4px); box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .card-overlay-link { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; }
    </style>
</div>
