<div th:fragment="main">
    <!-- Premium Banner -->
    <div class="page-banner feed">
        <span class="banner-icon">🌐</span>
        <div>
            <h1>Community Feed</h1>
            <p>Share achievements, connect with learners, and celebrate milestones!</p>
        </div>
        <a th:href="@{/posts/create}" class="btn" style="margin-left:auto; white-space:nowrap; background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.5); backdrop-filter:blur(8px);">✨ Create Post</a>
    </div>

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success" role="alert"
         style="display:flex; align-items:center; gap:0.75rem; background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.3); color:#6ee7b7; border-radius:12px; padding:1rem 1.25rem; margin-bottom:1.5rem;">
        <span style="font-size:1.2rem;">✅</span>
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert"
         style="display:flex; align-items:center; gap:0.75rem; background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.3); color:#fca5a5; border-radius:12px; padding:1rem 1.25rem; margin-bottom:1.5rem;">
        <span style="font-size:1.2rem;">⚠️</span>
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Posts List -->
    <div th:if="${posts == null or #lists.isEmpty(posts)}" class="empty-state">
        <span class="empty-icon">🌐</span>
        <p>No posts yet. Be the first to share!</p>
    </div>

    <div style="display:flex; flex-direction:column; gap:1.5rem;" th:if="${posts != null and !#lists.isEmpty(posts)}">
        <div th:each="post, ps : ${posts}" class="post-row" 
             style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.75rem; box-shadow:var(--shadow-sm); transition:transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;"
             onmouseover="this.style.borderColor='var(--border-focus)'; this.style.boxShadow='0 8px 25px rgba(0,0,0,0.4)'" onmouseout="this.style.borderColor='var(--border)'; this.style.boxShadow='var(--shadow-sm)'"
             th:style="'animation-delay:' + ${ps.index * 0.05} + 's'">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1.25rem;">
                <div class="post-author" style="display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap; margin:0;">
                    <span style="font-weight:700; color:var(--primary); font-size:1.05rem;" th:text="'@' + ${post.authorName != null ? post.authorName : 'Scholar'}">@username</span>
                    <span th:if="${post.status == 'PENDING'}" style="background:rgba(245,158,11,0.1); color:var(--orange); font-size:0.75rem; font-weight:700; padding:0.25rem 0.8rem; border-radius:999px; border:1px solid rgba(245,158,11,0.3); text-transform:uppercase;">⏳ PENDING</span>
                    <span th:if="${post.status == 'APPROVED'}" style="background:#10b981; color:white; font-size:0.75rem; font-weight:800; padding:0.25rem 0.8rem; border-radius:999px; display:inline-flex; align-items:center; gap:0.3rem;">✅ APPROVED</span>
                    <a th:if="${post.authorId != null}" th:href="@{/users/profile/{id}(id=${post.authorId})}" class="btn btn-sm btn-secondary" style="font-size:0.75rem; padding:0.2rem 0.6rem; text-decoration:none;">View Profile</a>
                </div>
                <span style="font-size:0.85rem; color:var(--text-muted); font-weight:500;"
                      th:text="${post.createdAt != null ? #temporals.format(post.createdAt, 'MMM d, yyyy') : ''}">Date</span>
            </div>
            
            <h4 th:if="${post.achievementType != null and !post.achievementType.isEmpty()}" th:text="${post.achievementType}" style="margin: 0.5rem 0 1rem 0; color: var(--secondary); background: rgba(0, 196, 204, 0.1); display: inline-block; padding: 0.3rem 0.8rem; border-radius: 999px; border: 1px solid rgba(0, 196, 204, 0.3); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;">Achievement Title</h4>
            <p class="post-content" th:text="${post.content}" style="margin:0 0 1.25rem 0; color:var(--text-main); line-height:1.7; font-size:1rem;">Post content</p>
            
            <div th:if="${post.imageUrl != null}" style="margin-bottom: 1.25rem; border-radius:var(--radius-sm); overflow:hidden; border: 1px solid var(--border);">
                <img th:src="${post.imageUrl}" alt="Post Image" style="width: 100%; max-height: 350px; object-fit: cover; display:block; transition:transform 0.5s ease;" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'"/>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border); padding-bottom: 1.25rem;">
                <a th:href="@{/posts/view/{id}(id=${post.id})}" class="btn btn-sm">Comment</a>
                <div style="display:flex; gap:0.5rem; align-items:center;">
                    <!-- Reactions Bar -->
                    <div style="display:flex; gap:0.5rem; align-items:center;">
                        <form th:action="@{/posts/react/{id}(id=${post.id})}" method="post" style="margin:0;">
                            <input type="hidden" name="type" value="like"/>
                            <button type="submit" class="btn btn-sm"
                                    th:style="${post.reactions != null and post.reactions.get('like') != null and currentUser != null and post.reactions.get('like').contains(currentUser.id)} ? 'background:var(--primary); color:white; padding:0.3rem 0.6rem;' : 'background:var(--surface-hover); border:1px solid var(--border); padding:0.3rem 0.6rem; color:var(--text-muted); transition: color 0.2s;'">
                                👍 <span th:text="${post.reactions != null && post.reactions.get('like') != null ? post.reactions.get('like').size() : 0}">0</span>
                            </button>
                        </form>
                        <form th:action="@{/posts/react/{id}(id=${post.id})}" method="post" style="margin:0;">
                            <input type="hidden" name="type" value="love"/>
                            <button type="submit" class="btn btn-sm"
                                    th:style="${post.reactions != null and post.reactions.get('love') != null and currentUser != null and post.reactions.get('love').contains(currentUser.id)} ? 'background:var(--red); color:white; padding:0.3rem 0.6rem;' : 'background:var(--surface-hover); border:1px solid var(--border); padding:0.3rem 0.6rem; color:var(--text-muted); transition: color 0.2s;'">
                                ❤️ <span th:text="${post.reactions != null && post.reactions.get('love') != null ? post.reactions.get('love').size() : 0}">0</span>
                            </button>
                        </form>
                        <form th:action="@{/posts/react/{id}(id=${post.id})}" method="post" style="margin:0;">
                            <input type="hidden" name="type" value="insight"/>
                            <button type="submit" class="btn btn-sm"
                                    th:style="${post.reactions != null and post.reactions.get('insight') != null and currentUser != null and post.reactions.get('insight').contains(currentUser.id)} ? 'background:var(--orange); color:white; padding:0.3rem 0.6rem;' : 'background:var(--surface-hover); border:1px solid var(--border); padding:0.3rem 0.6rem; color:var(--text-muted); transition: color 0.2s;'">
                                💡 <span th:text="${post.reactions != null && post.reactions.get('insight') != null ? post.reactions.get('insight').size() : 0}">0</span>
                            </button>
                        </form>
                    </div>
                    <form th:if="${post.status == 'PENDING' and currentUser != null and (currentUser.role == 'ADMIN' or currentUser.role == 'STAFF')}" th:action="@{/posts/approve/{id}(id=${post.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-secondary">Approve</button>
                    </form>
                    <!-- Admin/Staff moderation delete only -->
                    <form th:if="${currentUser != null and (currentUser.role == 'ADMIN' or currentUser.role == 'STAFF')}" th:action="@{/posts/delete/{id}(id=${post.id})}" method="post" onsubmit="confirmDelete(event, 'Delete post?')">
                        <button type="submit" class="btn btn-sm btn-red">Delete</button>
                    </form>
                </div>
            </div>
            <!-- COMMENTS SECTION -->
            <div style="margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem;">
                <!-- Comments Toggle -->
                <div th:if="${post.comments != null and !#lists.isEmpty(post.comments)}" style="margin-bottom: 0.8rem;">
                    <button type="button" class="btn btn-secondary btn-sm" th:data-postid="${post.id}" onclick="toggleComments(this.getAttribute('data-postid'))" style="font-size:0.8em; padding: 0.3rem 0.6rem; background: transparent; border: 1px solid var(--border); color: var(--text-muted); cursor: pointer;">
                        Show All Comments (<span th:text="${#lists.size(post.comments)}"></span>)
                    </button>
                </div>

                <div th:id="'comments-' + ${post.id}" style="display:none; flex-direction:column; gap:0.6rem;" th:if="${post.comments != null and !#lists.isEmpty(post.comments)}">
                    <div th:each="comment, cs : ${post.comments}" th:style="${comment.content != null and #strings.startsWith(comment.content, '@')} ? 'margin-left: 5rem; padding-left: 1rem; border-left: 3px solid var(--blue); margin-bottom: 0.5rem; padding-top: 0.3rem;' : 'margin-left: 2.5rem; padding-left: 1rem; border-left: 2px solid var(--border); margin-bottom: 0.5rem; padding-top: 0.3rem;'">
                        <div class="post-author" style="font-size: 0.85em;" th:text="'@' + ${comment.authorName != null ? comment.authorName : 'Scholar'}">@username</div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span class="post-content" style="font-size: 0.9em;" th:text="${comment.content}">Reply text</span>
                            <div style="display:flex; gap:0.4rem; align-items:center;">
                                <button type="button" class="btn" th:data-postid="${post.id}" th:data-author="${comment.authorName != null ? comment.authorName : 'Scholar'}" onclick="replyToComment(this.getAttribute('data-postid'), this.getAttribute('data-author'))" style="font-size: 0.7em; padding: 0.2rem 0.5rem; background: transparent; color: var(--blue); border: 1px solid var(--blue); cursor: pointer;">Reply</button>
                                <button type="button" class="btn" th:data-commentid="${comment.id}" onclick="reportComment(this.getAttribute('data-commentid'))" style="font-size: 0.7em; padding: 0.2rem 0.5rem; background: transparent; color: #ed8936; border: 1px solid #ed8936; cursor: pointer;">Report</button>
                                <a th:if="${currentUser != null and currentUser.id == comment.authorId}" th:href="@{/comments/edit/{id}(id=${comment.id})}" class="btn" style="font-size: 0.7em; padding: 0.2rem 0.5rem; background: transparent; color: var(--text-muted); border: 1px solid var(--border); text-decoration: none;">Edit</a>
                                <form th:if="${currentUser != null and (currentUser.id == comment.authorId or currentUser.role == 'ADMIN' or currentUser.role == 'STAFF')}" th:action="@{/comments/delete/{id}(id=${comment.id})}" method="post" onsubmit="confirmDelete(event, 'Delete comment?')">
                                    <button type="submit" class="btn" style="font-size: 0.7em; padding: 0.2rem 0.5rem; background: transparent; color: var(--red); border: 1px solid var(--red);">Delete</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Quick Comment Input -->
                <form th:action="@{/comments/create}" method="post" style="display:flex; gap:0.75rem; margin-top: 1rem;">
                    <input type="hidden" name="postId" th:value="${post.id}">
                    <input type="text" th:id="'comment-input-' + ${post.id}" name="content" placeholder="Write a comment..." required style="flex:1; font-size: 0.95rem; padding: 0.6rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); transition: border-color 0.3s, box-shadow 0.3s;" onfocus="this.style.boxShadow='0 0 0 3px var(--primary-glow)'" onblur="this.style.boxShadow='none'">
                    <button type="submit" class="btn" style="font-size: 0.9rem; padding: 0.6rem 1.25rem;">Add Comment</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleComments(postId) {
            const el = document.getElementById('comments-' + postId);
            if (el) {
                if (el.style.display === 'none') {
                    el.style.display = 'flex';
                } else {
                    el.style.display = 'none';
                }
            }
        }
        function replyToComment(postId, username) {
            const input = document.getElementById('comment-input-' + postId);
            if (input) {
                input.value = '@' + username + ' ';
                input.focus();
            }
            const commentsDiv = document.getElementById('comments-' + postId);
            if (commentsDiv && commentsDiv.style.display === 'none') {
                commentsDiv.style.display = 'flex';
            }
        }

        function reportComment(commentId) {
            Swal.fire({
                title: 'Report Comment',
                input: 'textarea',
                inputLabel: 'Reason for reporting',
                inputPlaceholder: 'Why is this inappropriate?',
                showCancelButton: true,
                confirmButtonText: 'Submit for review',
                confirmButtonColor: '#ed8936',
                inputValidator: (value) => {
                    if (!value) {
                        return 'You need to write a reason!'
                    }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/reports/create';
                    
                    const commentIdInput = document.createElement('input');
                    commentIdInput.type = 'hidden';
                    commentIdInput.name = 'commentId';
                    commentIdInput.value = commentId;
                    form.appendChild(commentIdInput);
                    
                    const reasonInput = document.createElement('input');
                    reasonInput.type = 'hidden';
                    reasonInput.name = 'reason';
                    reasonInput.value = result.value;
                    form.appendChild(reasonInput);
                    
                    document.body.appendChild(form);
                    form.submit();
                }
            });
        }
    </script>
</div>
