<div th:fragment="main">
    <div style="max-width: 500px; margin: 2rem auto;">
        <div class="form-card">
            <h2 style="margin-bottom:1.5rem;">Edit Feedback</h2>
            <form th:action="@{/feedback/update/{id}(id=${feedback.id})}" th:object="${feedback}" method="post">
                <input type="hidden" th:field="*{courseId}">
                <div class="form-group">
                    <label>Rating</label>
                    <div class="star-rating">
                        <input type="radio" id="star5" name="rating" value="5" th:field="*{rating}" required/><label for="star5" title="5 stars">★</label>
                        <input type="radio" id="star4" name="rating" value="4" th:field="*{rating}" /><label for="star4" title="4 stars">★</label>
                        <input type="radio" id="star3" name="rating" value="3" th:field="*{rating}" /><label for="star3" title="3 stars">★</label>
                        <input type="radio" id="star2" name="rating" value="2" th:field="*{rating}" /><label for="star2" title="2 stars">★</label>
                        <input type="radio" id="star1" name="rating" value="1" th:field="*{rating}" /><label for="star1" title="1 star">★</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Your Review (Optional)</label>
                    <textarea th:field="*{content}" rows="4"></textarea>
                </div>
                <div style="display:flex; gap:0.75rem;">
                    <button type="submit" class="btn">Save Changes</button>
                    <a th:href="@{/feedback/course/{id}(id=${feedback.courseId})}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    </div>

    <style>
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            margin-bottom: 0.5rem;
        }
        .star-rating input { display: none; }
        .star-rating label { font-size: 2.2rem; color: #ccc; cursor: pointer; transition: color 0.2s; margin-right: 0.2rem; }
        .star-rating input:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label { color: #f39c12; }
    </style>
</div>
