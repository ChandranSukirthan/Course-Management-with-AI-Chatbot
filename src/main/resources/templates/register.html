<div th:fragment="main">
    <div style="max-width: 480px; margin: 3rem auto;">
        <div class="form-card">
            <h2 class="text-center" style="margin-bottom: 1.5rem;">Sign Up</h2>

            <div th:if="${registerError}" class="alert alert-error">
                <span th:text="${registerError}">Error</span>
            </div>

            <form th:action="@{/users/register}" th:object="${user}" method="post">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" th:field="*{fullName}" placeholder="Full name" th:classappend="${#fields.hasErrors('fullName')} ? 'input-error' : ''" required>
                        <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="error-text"></span>
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" th:field="*{username}" placeholder="Username" th:classappend="${#fields.hasErrors('username')} ? 'input-error' : ''" required>
                        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error-text"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" placeholder="Email address" th:classappend="${#fields.hasErrors('email')} ? 'input-error' : ''" required>
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-text"></span>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" th:field="*{password}" placeholder="Password" th:classappend="${#fields.hasErrors('password')} ? 'input-error' : ''" required>
                        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-text" style="line-height:1.2;"></span>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" th:field="*{confirmPassword}" placeholder="Confirm Password" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'input-error' : ''" required>
                         <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="error-text"></span>
                    </div>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Sign Up</button>
            </form>

            <p style="text-align: center; margin-top: 1.2rem; color: var(--text-muted); font-size: 0.9rem;">
                Already have an account?
                <a th:href="@{/users/login}" style="color: var(--primary); font-weight: 700;">Log in</a>
            </p>
        </div>
    </div>
</div>
